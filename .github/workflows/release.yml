name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - test and package
    runs-on: windows-2025
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      RUSTUP_TOOLCHAIN: 1.99.1-x86_64-pc-windows-msvc
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      CARGO_TARGET_DIR: target
      CARGO_HOME: ${{ github.workspace }}/work/cargo-home
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: always
      OVMS_TEST_BUNDLE: ${{ github.workspace }}/work/runtime-python-on
    outputs:
      version: ${{ steps.version.outputs.version }}
      archive: ${{ steps.version.outputs.archive }}
      artifact: ${{ steps.version.outputs.artifact }}
      commit: ${{ steps.version.outputs.commit }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Validate release version
        id: version
        run: |
          New-Item -ItemType Directory -Force -Path work/ci | Out-Null
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/release_metadata.py --tag $env:GITHUB_REF_NAME --github-output $env:GITHUB_OUTPUT
          } else {
            python scripts/release_metadata.py --github-output $env:GITHUB_OUTPUT
          }
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release version' }
          $sourceCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the source commit' }
          "commit=$sourceCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Rust
        run: rustup toolchain install 1.99.1-x86_64-pc-windows-msvc --profile minimal --component rustfmt,clippy --no-self-update

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            work/cargo-home/registry/index
            work/cargo-home/registry/cache
            work/cargo-home/git/db
          key: cargo-windows-msvc-1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-windows-msvc-1.99.1-

      - name: Verify release automation
        run: python -m unittest discover -s tests -p test_release.py -v

      - name: Download and verify the native OVMS test fixture
        run: python scripts/fetch-runtime.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust code
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run contract tests
        run: |
          cargo test --locked --test contracts 2>&1 | Tee-Object -FilePath work/ci/contracts.log
          if ($LASTEXITCODE -ne 0) { throw 'Contract tests failed' }

      - name: Run real OVMS tests
        run: |
          cargo test --locked --test real_ovms -- --ignored --test-threads=1 2>&1 | Tee-Object -FilePath work/ci/runtime.log
          if ($LASTEXITCODE -ne 0) { throw 'Real OVMS tests failed' }

      - name: Run deployment and runtime-management tests
        run: |
          cargo test --locked --test deployment 2>&1 | Tee-Object -FilePath work/ci/deployment.log
          if ($LASTEXITCODE -ne 0) { throw 'Deployment tests failed' }

      - name: Verify CLI parameter coverage
        run: python scripts/check_parameters.py

      - name: Build the release executable
        run: cargo build --locked --release

      - name: Verify the UI-only package and on-demand native download
        run: |
          ./scripts/package.ps1 -StageOnly -ReleaseBinary target/x86_64-pc-windows-msvc/release/ovms-studio.exe
          $bundle = Get-Content -LiteralPath work/bundle-stage.json -Raw | ConvertFrom-Json
          python scripts/check_bundle.py $bundle.stage
          if ($LASTEXITCODE -ne 0) { throw 'Portable application verification failed' }

      - name: Generate build verification notes
        run: python scripts/write_ci_verification.py

      - name: Package ZIP and SHA-256
        run: ./scripts/package.ps1 -ReleaseBinary target/x86_64-pc-windows-msvc/release/ovms-studio.exe

      - name: Upload the complete application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            dist/${{ steps.version.outputs.archive }}
            dist/${{ steps.version.outputs.archive }}.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/ci/*.log
            work/bundle-check-result.json
            work/parameter-check.json
            work/bundle-check-*/ui/*.png
            work/bundle-check-*/ui/report.json
            work/bundle-check-*/ui.log
            docs/verification.md
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Linux Docker - real image and inference
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: ${{ github.workflow }}-docker-${{ github.ref }}
      cancel-in-progress: true
    env:
      RUSTUP_TOOLCHAIN: 1.99.1-x86_64-unknown-linux-gnu
      CARGO_HOME: ${{ github.workspace }}/work/cargo-home-linux
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install 1.99.1-x86_64-unknown-linux-gnu --profile minimal --no-self-update
      - name: Check Docker engine
        run: docker version
      - name: Test real Docker provisioning and server lifecycle
        run: |
          mkdir -p work/ci
          set -o pipefail
          cargo test --locked --no-default-features --test real_docker -- --ignored --test-threads=1 --nocapture 2>&1 | tee work/ci/docker.log
      - name: Upload Docker verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/ci/docker.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish a new version
    needs: [build, docker]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: ovms-release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Download the verified application
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release-assets

      - name: Verify assets and publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
          APP_VERSION: ${{ needs.build.outputs.version }}
          ARCHIVE_NAME: ${{ needs.build.outputs.archive }}
        run: |
          python scripts/publish_release.py \
            --repo "$GH_REPO" \
            --commit "$SOURCE_COMMIT" \
            --version "$APP_VERSION" \
            --archive "release-assets/$ARCHIVE_NAME" \
            --checksum "release-assets/$ARCHIVE_NAME.sha256"
