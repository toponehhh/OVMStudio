[package]
name = "ovms-studio"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "A native Rust + Slint launcher for Intel OpenVINO Model Server"
license = "MIT"
build = "build.rs"

[features]
default = ["desktop"]
desktop = ["dep:slint", "dep:slint-build", "dep:rfd", "dep:arboard", "dep:open", "dep:png"]

[[bin]]
name = "ovms-studio"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17", optional = true, default-features = false, features = ["xdg-portal"] }
directories = "6"
arboard = { version = "3", optional = true, default-features = false }
open = { version = "5", optional = true }
png = { version = "0.18", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
sha2 = "0.10"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }

[profile.release]
lto = "thin"
strip = true
